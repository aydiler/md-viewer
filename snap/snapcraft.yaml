name: md-viewer
base: core22
version: '0.3.14'
summary: Fast, lightweight markdown viewer for Linux
title: md-viewer
license: MIT
contact: https://github.com/aydiler/md-viewer/issues
issues: https://github.com/aydiler/md-viewer/issues
source-code: https://github.com/aydiler/md-viewer
website: https://github.com/aydiler/md-viewer
description: |
  A fast, lightweight markdown viewer built with Rust and egui. Designed for
  distraction-free reading with excellent typography, syntax highlighting and
  LaTeX math, from quick notes to scientific papers.

  Rendering:
  - GitHub Flavored Markdown (tables, task lists, footnotes, emoji shortcodes like :pushpin:)
  - LaTeX math, inline and display, rendered via typst + mitex and aligned to the surrounding text
  - Syntax highlighting for 200+ languages
  - Mermaid diagrams (flowcharts, sequence diagrams) rendered natively, click to enlarge
  - Tables fill the pane and re-fit when the window or a sidebar changes size; cell text wraps, and dividers can be dragged to override
  - HTML tables with proper cell padding
  - YAML frontmatter shown as a key/value table
  - Images and SVG (PNG, JPEG, GIF, SVG, HTTP URLs), click to enlarge
  - Right-to-left text: Arabic and Hebrew paragraphs, headings, lists and table cells are right-aligned, mixed-direction lines read in order
  - Unicode: installed system fonts are picked per script for CJK and other non-Latin text; a monochrome emoji font is bundled
  - Only the visible part of a long document is painted
  - 1.5x line height for readability (WCAG 2.1)

  Navigation:
  - Tabs for multiple documents (Ctrl+Click a link to open it in a new tab)
  - In-document search (Ctrl+F) with inline highlights; Enter/Shift+Enter cycle matches
  - File explorer sidebar, sorted by name or date; File > Open Folder sets its root
  - Outline sidebar with click-to-navigate table of contents
  - Per-tab back/forward history (Alt+Left/Right) and internal links between markdown files

  View:
  - Dark and light themes (Ctrl+D)
  - Zoom 50%-300% (Ctrl++/-/0 or Ctrl+Scroll)
  - Full Width on by default; Ctrl+Shift+W switches to a reading-width column
  - Formula size, fonts, highlight and link colours, and smooth text rendering in the View menu
  - Tab bar can be hidden
  - Shift+Scroll over a wide table scrolls it horizontally
  - Live reload on file changes (enabled by default)

  Editing:
  - Switch a tab between Preview and Edit (Ctrl+E) and save with Ctrl+S

  Usability:
  - Welcome page with Open File / Open Folder and recent files
  - Drag and drop files to open
  - Native file and folder dialogs
  - Session persistence (tabs, theme, zoom, sidebar state)
  - Native X11 and Wayland support

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  md-viewer:
    command: bin/md-viewer
    desktop: usr/share/applications/md-viewer.desktop
    plugs:
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - gsettings
    environment:
      XDG_DATA_DIRS: $SNAP/usr/share:$XDG_DATA_DIRS
      # xkbcommon and Mesa search compiled-in absolute paths, which inside the
      # strict-confinement mount namespace resolve to the (empty) core22 base,
      # not $SNAP — point both at the staged copies (#55).
      XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb
      LIBGL_DRIVERS_PATH: $SNAP/usr/lib/x86_64-linux-gnu/dri

parts:
  md-viewer:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - clang
      - pkg-config
      - libxcb1-dev
      - libxcb-render0-dev
      - libxcb-shape0-dev
      - libxcb-xfixes0-dev
      - libxkbcommon-dev
      - libfontconfig1-dev
    stage-packages:
      - libxcb1
      - libxkbcommon0
      # winit dlopens its X11 stack at runtime, so snapcraft's link-time
      # dependency staging never picks these up (#55). XConnection::new opens
      # Xlib, Xcursor (which needs Xrender), Xlib-xcb and XInput2. Until 0.3.9
      # libgtk-3-0 pulled several of them in as its own dependencies; removing
      # it broke every X11 session (#272). scripts/snap-ci.sh checks the list.
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxrender1
      - libxi6
      - libxrandr2
      - libx11-data
      - xkb-data
      - libfontconfig1
      # No gtk/glib: the app never loads them. rfd's portal file dialog
      # dlopens libdbus-1.so.3, which the core22 base already provides.
      - libgl1
      - libwayland-client0
      - libwayland-egl1
    override-build: |
      # Remove optional MCP dependency (not needed in production, path doesn't exist in snap build)
      sed -i '/egui-mcp-bridge/d' Cargo.toml
      sed -i 's/mcp = \["dep:egui-mcp-bridge"\]/mcp = []/' Cargo.toml
      craftctl default
      install -Dm644 data/md-viewer.desktop "$CRAFT_PART_INSTALL/usr/share/applications/md-viewer.desktop"
      install -Dm644 data/io.github.aydiler.md-viewer.png "$CRAFT_PART_INSTALL/usr/share/pixmaps/md-viewer.png"
      sed -i 's|^Icon=.*|Icon=/usr/share/pixmaps/md-viewer.png|' "$CRAFT_PART_INSTALL/usr/share/applications/md-viewer.desktop"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/md-viewer/LICENSE"
      install -Dm644 THIRD_PARTY_NOTICES "$CRAFT_PART_INSTALL/usr/share/doc/md-viewer/THIRD_PARTY_NOTICES"
