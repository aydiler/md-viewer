name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Remove local-only MCP dependency
        run: |
          # Remove the path dependency line but keep the feature (as empty)
          # First, change the mcp feature to empty (must do before removing dep line)
          sed -i 's/mcp = \["dep:egui-mcp-bridge"\]/mcp = []/' Cargo.toml
          # Then remove the optional dependency line
          sed -i '/^egui-mcp-bridge = /d' Cargo.toml

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build --release
      - run: cargo test

  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RENDERER_FEATURES: better_syntax_highlighting,svg,svg_text,load-images,fetch,mermaid,math,macros
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/egui_commonmark -> target

      - name: Lint renderer crates
        run: |
          cargo clippy --manifest-path crates/egui_commonmark/Cargo.toml -p egui_commonmark_extended --all-targets --features "$RENDERER_FEATURES"
          cargo clippy --manifest-path crates/egui_commonmark/Cargo.toml -p egui_commonmark_backend_extended --all-targets --all-features
          cargo clippy --manifest-path crates/egui_commonmark/Cargo.toml -p egui_commonmark_macros_extended --all-targets

      - name: Test renderer crates
        run: |
          cargo test --manifest-path crates/egui_commonmark/Cargo.toml -p egui_commonmark_extended --features "$RENDERER_FEATURES"
          cargo test --manifest-path crates/egui_commonmark/Cargo.toml -p egui_commonmark_backend_extended --no-default-features
          cargo test --manifest-path crates/egui_commonmark/Cargo.toml -p egui_commonmark_backend_extended --all-features
          cargo test --manifest-path crates/egui_commonmark/Cargo.toml -p egui_commonmark_macros_extended

  version-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check app/renderer workspace dependency contract
        run: bash scripts/check-workspace-sync.sh
      - name: Check versions match
        run: |
          # Robust extraction tolerating quotes and spacing
          CARGO_VER=$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/{print $2; exit}' Cargo.toml)
          SNAP_VER=$(sed -n "s/^version:[[:space:]]*['\"]\\?\\([0-9]\\+\\.[0-9]\\+\\.[0-9]\\+\\)['\"]\\?/\\1/p" snap/snapcraft.yaml)

          META_VER=$(grep -m1 -oP '<release version="\K[^"]+' data/io.github.aydiler.md-viewer.metainfo.xml)

          echo "Cargo.toml: $CARGO_VER"
          echo "snapcraft.yaml: $SNAP_VER"
          echo "metainfo (newest release): $META_VER"

          if [ "$CARGO_VER" != "$SNAP_VER" ]; then
            echo "::error::Version mismatch! Cargo=$CARGO_VER Snap=$SNAP_VER"
            exit 1
          fi
          if [ "$CARGO_VER" != "$META_VER" ]; then
            echo "::error::metainfo's newest <release> is $META_VER, Cargo.toml is $CARGO_VER. Add a <release> entry to data/io.github.aydiler.md-viewer.metainfo.xml."
            exit 1
          fi

  crates-package:
    # The package `cargo publish` would upload, built against epaint from
    # crates.io. Same steps and reasoning as release.yml's
    # `crates-package-check` (devlog 077); here it runs on every PR so a
    # crates.io-only build error (#215) shows up before a tag.
    name: crates.io package builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: crates-package

      - name: Prepare the crates.io manifest
        run: python3 scripts/prepare-crates-manifest.py

      - name: cargo publish --dry-run (md-viewer)
        run: |
          F=crates/egui_commonmark
          cargo publish --dry-run --allow-dirty -p md-viewer \
            --config "patch.crates-io.egui_commonmark_extended.path=\"$F/egui_commonmark\"" \
            --config "patch.crates-io.egui_commonmark_backend_extended.path=\"$F/egui_commonmark_backend\""
