name: Release
on:
  push:
    tags: ['v*']
  # Dry run: `gh workflow run release.yml --ref main`. Builds every platform
  # (and the snap) on the same runner images a real release uses, and
  # publishes nothing: every publish job/step is gated on `push`. Exists
  # because a retired runner image (macos-14, v0.3.1) and a crates.io-only
  # compile error (#215) were each found only after the tag was pushed.
  # `crates-package-check` runs only here and builds the crates.io package.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag matches versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag, Cargo.toml, snapcraft.yaml versions
        id: version
        # Fails fast if the pushed tag (v0.1.10) disagrees with either
        # Cargo.toml's `version = "..."` or snapcraft.yaml's `version: '...'`.
        # Extraction logic lifted verbatim from ci.yml:version-sync.
        run: |
          CARGO_VER=$(awk -F'"' '/^version[[:space:]]*=[[:space:]]*"/{print $2; exit}' Cargo.toml)
          SNAP_VER=$(sed -n "s/^version:[[:space:]]*['\"]\\?\\([0-9]\\+\\.[0-9]\\+\\.[0-9]\\+\\)['\"]\\?.*/\\1/p" snap/snapcraft.yaml)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
          else
            # Dry run: no tag. Still enforce Cargo.toml == snapcraft.yaml.
            TAG_VER="$CARGO_VER"
          fi
          echo "event=$GITHUB_EVENT_NAME tag=$TAG_VER cargo=$CARGO_VER snap=$SNAP_VER"
          if [ "$TAG_VER" != "$CARGO_VER" ] || [ "$CARGO_VER" != "$SNAP_VER" ]; then
            echo "::error::Version mismatch: tag=v$TAG_VER cargo=$CARGO_VER snap=$SNAP_VER"
            exit 1
          fi
          echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"

      - name: Vendored fork is publishable to crates.io
        # Fails the release if the vendored egui_commonmark fork's source differs
        # from what is already published at its pinned version. crates.io is
        # immutable, so without a fork version bump `cargo install md-viewer`
        # would build against stale fork code (source builds — snap/AUR/binaries
        # — use the local fork via [patch.crates-io] and are unaffected).
        run: bash scripts/check-fork-publishable.sh

  check-crates-token:
    # Deliberately its own job, gating `publish-crates` only.
    #
    # This check first lived in `validate`, which every other job needs — so a
    # dead token blocked the snap, both AUR packages, the GitHub Release and
    # the binaries as well. Losing four channels to one expired credential is
    # worse than the silent crates.io gap the check exists to prevent.
    #
    # Here it still fails in about a second rather than twenty minutes in, and
    # the run still goes red under an obvious name, but the other channels
    # publish.
    if: github.event_name == 'push'
    name: crates.io token is valid
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
        - name: crates.io token is present and well formed
          # This job previously called `GET /api/v1/me` with the token in an
          # `Authorization` header. That check could never pass. The endpoint is
          # session-only, and crates.io answers *any* API token with
          #
          #   403 {"detail":"this action can only be performed on the crates.io website"}
          #
          # so a perfectly valid token failed the gate and `publish-crates` was
          # skipped — manufacturing exactly the silent crates.io gap this job
          # exists to prevent. It was added in #135 and never exercised against a
          # working token, because the token was already dead when it landed.
          #
          # crates.io publishes no read-only endpoint that authenticates with an
          # API token, so there is nothing to probe: the only proof of validity
          # is a publish. What is left is a shape check, which still catches the
          # two failure modes that actually occur — an unset secret and a paste
          # that lost characters — in about a second, before anything is built.
          #
          # A genuinely revoked token now fails in `publish-crates`, which since
          # #151 gates nothing else: the snap, both AUR packages and the GitHub
          # Release publish regardless, and the run still goes red.
          #
          # Historical note: v0.1.16 and v0.1.17 really did fail with
          # `403 Forbidden: authentication failed` — but from `cargo publish`,
          # which is genuinely token-authenticated. That diagnosis stands; only
          # the probe built to catch it was wrong.
          env:
            CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          run: |
            if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
              echo "::notice::CARGO_REGISTRY_TOKEN is unset — crates.io publish will be skipped."
              exit 0
            fi
            # Shape only. See the comment above for why there is nothing to probe.
            if printf '%s' "${CARGO_REGISTRY_TOKEN}" | grep -qE '^cio[A-Za-z0-9]{32}$'; then
              echo "CARGO_REGISTRY_TOKEN is present and well formed; validity is proven by publish-crates."
            else
              LEN=$(printf '%s' "${CARGO_REGISTRY_TOKEN}" | wc -c)
              echo "::error::CARGO_REGISTRY_TOKEN is not the shape of a crates.io token (expected 'cio' followed by 32 alphanumerics, got ${LEN} characters). Re-copy it from https://crates.io/settings/tokens — a truncated paste looks exactly like this."
              exit 1
            fi

  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: linux-x86_64
          # macos-14 was retired by GitHub ("configuration 'macos-14-arm64-us-default'
          # is not supported"), which cancelled the v0.3.1 build leg and skipped every
          # publish job. macos-latest matches cross-platform.yml. The binary's minimum
          # macOS comes from rustc's aarch64-apple-darwin deployment target, not from
          # the runner image.
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Remove local-only MCP dependency
        # Anchored to start-of-line so commented `# mcp = ...` / `# egui-mcp-bridge = ...`
        # lines are untouched (regression caught in v0.1.9 publish-crates failure).
        shell: python
        run: |
          import pathlib, re
          p = pathlib.Path("Cargo.toml")
          t = p.read_text()
          t = re.sub(r'(?m)^mcp\s*=\s*\["dep:egui-mcp-bridge"\]', 'mcp = []', t)
          t = re.sub(r'(?m)^egui-mcp-bridge\s*=\s*.*\n', '', t)
          p.write_text(t)

      - name: Install git-cliff
        if: runner.os == 'Linux'
        run: cargo install git-cliff

      - name: Generate changelog
        if: runner.os == 'Linux'
        # From CHANGELOG.md, not `git-cliff --latest`. git-cliff parses
        # conventional commits and this history does not conform: v0.1.17's
        # release page carried eleven lines while its CHANGELOG entry was a page
        # of prose. The Release page is the only changelog most users ever see —
        # snap and AUR users never open the repository. Falls back to git-cliff
        # when the tagged version has no section.
        run: |
          bash scripts/release-notes.sh "$VERSION" > RELEASE_NOTES.md
          echo "release notes: $(wc -l < RELEASE_NOTES.md) lines"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ASSET="md-viewer-${VERSION}-${{ matrix.asset_name }}.tar.gz"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" md-viewer \
            -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_NOTICES
          shasum -a 256 "$ASSET" > "$ASSET.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${env:VERSION}"
          $ASSET = "md-viewer-$VERSION-${{ matrix.asset_name }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/md-viewer.exe", "LICENSE", "THIRD_PARTY_NOTICES" -DestinationPath $ASSET
          $Hash = (Get-FileHash -Algorithm SHA256 $ASSET).Hash.ToLower()
          "$Hash  $ASSET" | Out-File -Encoding ascii "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          if-no-files-found: error
          path: |
            md-viewer-*.tar.gz
            md-viewer-*.zip
            md-viewer-*.sha256
            RELEASE_NOTES.md

  publish-crates:
    name: Publish to crates.io
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [validate, build, check-crates-token]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      # Step-level gating, same pattern as publish-aur. GitHub Actions disallows
      # secrets.* and env.* in job-level `if:` — see LESSONS.md.
      - name: Check crates.io token
        id: check
        run: |
          if [ -z "$CARGO_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set; skipping crates.io publish (see PUBLISHING.md for setup)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.proceed == 'true'

      - name: Install system dependencies
        if: steps.check.outputs.proceed == 'true'
        # md-viewer's `cargo publish` verify step compiles the packaged crate
        # against crates.io deps (no patch), which links eframe/rfd/etc. Same
        # apt set as the build job.
        timeout-minutes: 8
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.proceed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.check.outputs.proceed == 'true'
        with:
          key: publish-crates

      - name: Prepare the crates.io manifest
        # Strips the local-only MCP dependency. Shared with
        # `crates-package-check`, so the dry run verifies exactly the manifest
        # this job publishes.
        if: steps.check.outputs.proceed == 'true'
        run: python3 scripts/prepare-crates-manifest.py

      - name: Publish fork crates and md-viewer
        if: steps.check.outputs.proceed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh

  crates-package-check:
    # Dry run only: builds the md-viewer package crates.io would receive, the
    # one channel no other job compiles. `cargo publish` ignores
    # `[patch.crates-io]`, so this is the build that resolves epaint from the
    # registry — where #215 (a field only the vendored epaint has) broke 0.3.1
    # after the tag, with every other channel green.
    #
    # The egui_commonmark fork is patched to the local checkout through
    # `--config`, epaint is not. On a tag, `publish-crates` uploads the fork
    # from this same checkout before md-viewer, so the local fork is what
    # crates.io will hold; `validate` (check-fork-publishable.sh) separately
    # fails if a fork version already on crates.io differs from it. Without
    # the patch the check would build against the fork already on crates.io,
    # which is stale whenever the fork changed (and missing any API the new
    # md-viewer needs).
    #
    # No `needs`: it uses nothing from `validate`, and should still report
    # when `validate` fails for an unrelated reason.
    if: github.event_name == 'workflow_dispatch'
    name: crates.io package builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update --error-on=any -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 clang pkg-config libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libfontconfig1-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      - name: Prepare the crates.io manifest
        run: python3 scripts/prepare-crates-manifest.py

      - name: cargo publish --dry-run (md-viewer)
        run: |
          F=crates/egui_commonmark
          cargo publish --dry-run --allow-dirty -p md-viewer \
            --config "patch.crates-io.egui_commonmark_extended.path=\"$F/egui_commonmark\"" \
            --config "patch.crates-io.egui_commonmark_backend_extended.path=\"$F/egui_commonmark_backend\""

  publish-snap:
    name: Publish to Snap Store
    runs-on: ubuntu-24.04
    needs: [validate, build]
    timeout-minutes: 60  # build + store retries with backoff
    permissions:
      contents: read
    env:
      SNAP_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      # Step-level gating, same pattern as publish-aur and publish-crates.
      # If SNAPCRAFT_STORE_CREDENTIALS isn't set, skip cleanly with a notice
      # instead of erroring out the whole release.
      - name: Check Snap Store credentials
        id: check
        run: |
          if [ -z "$SNAP_CREDS" ]; then
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS not set; skipping snap publish (see PUBLISHING.md for setup)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.proceed == 'true'

      # scripts/snap-ci.sh replaces snapcore/action-build + action-publish.
      # Those call the Snap Store once per step with no retry; on 2026-11-12
      # the store dropped about one request in twelve and v0.3.2's snap job
      # failed six times at `snap install lxd` before building anything
      # (devlog 078). The script mirrors the actions' steps, retried.
      #
      # The upload also runs `snapcraft upload-metadata --force`: the listing
      # description comes from the snap's embedded snapcraft.yaml, so the repo
      # stays the source of truth over web-UI edits. (`push-metadata` was
      # renamed `upload-metadata`; v0.1.14 failed on the old verb, LESSONS.)
      - name: Install LXD and snapcraft
        if: steps.check.outputs.proceed == 'true'
        run: bash scripts/snap-ci.sh setup

      - name: Build snap
        if: steps.check.outputs.proceed == 'true'
        id: build
        run: bash scripts/snap-ci.sh build

      - name: Upload to Snap Store (stable) and sync listing metadata
        if: steps.check.outputs.proceed == 'true' && github.event_name == 'push'
        run: bash scripts/snap-ci.sh publish "${{ steps.build.outputs.snap }}"
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

  publish-aur:
    name: Publish to AUR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [validate, build]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      # GitHub Actions disallows both `secrets.*` and `env.*` in job-level `if:`,
      # so we gate at step level instead. This step always succeeds and sets an
      # output that subsequent steps check, leaving the job green when the secret
      # isn't configured.
      - name: Check AUR secret
        id: check
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY not set; skipping AUR publish (see PUBLISHING.md for setup)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.proceed == 'true'

      - name: Set version
        if: steps.check.outputs.proceed == 'true'
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Set up SSH for AUR
        if: steps.check.outputs.proceed == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur
              User aur
              StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Clone AUR repo and update PKGBUILD
        if: steps.check.outputs.proceed == 'true'
        run: |
          git clone ssh://aur@aur.archlinux.org/md-viewer-git.git aur-repo
          cp aur/PKGBUILD aur-repo/PKGBUILD
          # Bump the literal pkgver line so the file reflects the latest tag.
          # (Build-time pkgver() still overrides at install, but this keeps the file readable.)
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" aur-repo/PKGBUILD

      - name: Regenerate .SRCINFO
        if: steps.check.outputs.proceed == 'true'
        run: |
          # makepkg refuses to run as root; spin up an Arch container with an unprivileged user.
          docker run --rm -v "$PWD/aur-repo:/pkg" -w /pkg archlinux/archlinux:base-devel bash -c '
            useradd -m builder &&
            chown -R builder /pkg &&
            sudo -u builder makepkg --printsrcinfo
          ' > aur-repo/.SRCINFO

      - name: Restore aur-repo ownership to runner
        if: steps.check.outputs.proceed == 'true'
        # The container's chown -R builder propagated through the bind mount, so
        # the host runner can no longer write inside aur-repo (e.g. .git/config).
        # Reclaim ownership before doing git config / commit / push.
        run: sudo chown -R "$(id -u):$(id -g)" aur-repo

      - name: Commit and push to AUR
        if: steps.check.outputs.proceed == 'true'
        working-directory: aur-repo
        run: |
          git config user.name "md-viewer CI"
          git config user.email "ci@noreply.aydiler"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to push to AUR."
            exit 0
          fi
          git commit -m "Update to ${VERSION}"
          git push

  publish-aur-bin:
    name: Publish to AUR (-bin)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [validate, build]
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      # Same step-level gating as publish-aur (see LESSONS.md → "GitHub Actions
      # blocks `secrets.*` AND `env.*` in job-level `if:`").
      - name: Check AUR secret
        id: check
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY not set; skipping AUR -bin publish (see PUBLISHING.md for setup)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.proceed == 'true'

      - name: Set version
        if: steps.check.outputs.proceed == 'true'
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Set up SSH for AUR
        if: steps.check.outputs.proceed == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur
              User aur
              StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      # The tarball checksum comes from the build job's artifact rather than
      # the GitHub Release. Both publish-aur-bin and create-release are
      # `needs: [validate, build]` and run in parallel — so this job races
      # ahead of the Release URL existing. The artifact already contains the
      # exact .sha256 file we'd otherwise fetch from the Release page.
      - name: Download linux build artifact (for tarball sha256)
        if: steps.check.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/

      - name: Clone AUR repo and update PKGBUILD
        if: steps.check.outputs.proceed == 'true'
        run: |
          # On first run for this package, the repo doesn't exist yet — AUR
          # creates it on first push. `git clone` of a not-yet-existing repo
          # returns "warning: You appear to have cloned an empty repository."
          # which is fine; we initialize it from the staged PKGBUILD.
          git clone ssh://aur@aur.archlinux.org/md-viewer-bin.git aur-repo || true
          if [ ! -d aur-repo ]; then
            mkdir aur-repo
            (cd aur-repo && git init -b master && \
             git remote add origin ssh://aur@aur.archlinux.org/md-viewer-bin.git)
          fi
          cp aur-bin/PKGBUILD aur-repo/PKGBUILD

          # Tarball sha256 comes from the downloaded artifact (see comment above).
          # The four aux files (.desktop, icon, LICENSE, notice) come from raw.github
          # at the tagged commit — those URLs are valid as soon as the tag exists.
          mkdir -p sums
          cp "dist/md-viewer-${VERSION}-linux-x86_64.tar.gz.sha256" sums/tarball.sha256
          curl -fsSL "https://raw.githubusercontent.com/aydiler/md-viewer/v${VERSION}/data/md-viewer.desktop" \
            | sha256sum > sums/desktop.sha256
          curl -fsSL "https://raw.githubusercontent.com/aydiler/md-viewer/v${VERSION}/data/io.github.aydiler.md-viewer.png" \
            | sha256sum > sums/icon.sha256
          curl -fsSL "https://raw.githubusercontent.com/aydiler/md-viewer/v${VERSION}/LICENSE" \
            | sha256sum > sums/license.sha256
          curl -fsSL "https://raw.githubusercontent.com/aydiler/md-viewer/v${VERSION}/THIRD_PARTY_NOTICES" \
            | sha256sum > sums/notice.sha256

          # Rewrite pkgver and the five-element sha256sums=( ... ) array.
          # sed on a multi-line array is fragile, so use Python.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("aur-repo/PKGBUILD")
          sums = [open(f"sums/{n}.sha256").read().split()[0]
                  for n in ("tarball", "desktop", "icon", "license", "notice")]
          import os
          version = os.environ["VERSION"]
          text = p.read_text()
          text = re.sub(r"^pkgver=.*$", f"pkgver={version}", text, count=1, flags=re.M)
          block = "sha256sums=(\n    '" + "'\n    '".join(sums) + "'\n)"
          text = re.sub(r"sha256sums=\([^)]*\)", block, text, count=1, flags=re.S)
          p.write_text(text)
          PY

      - name: Regenerate .SRCINFO
        if: steps.check.outputs.proceed == 'true'
        run: |
          docker run --rm -v "$PWD/aur-repo:/pkg" -w /pkg archlinux/archlinux:base-devel bash -c '
            useradd -m builder &&
            chown -R builder /pkg &&
            sudo -u builder makepkg --printsrcinfo
          ' > aur-repo/.SRCINFO

      - name: Restore aur-repo ownership to runner
        if: steps.check.outputs.proceed == 'true'
        # See LESSONS.md → "Docker bind-mount `chown` breaks host runner ownership".
        run: sudo chown -R "$(id -u):$(id -g)" aur-repo

      - name: Commit and push to AUR
        if: steps.check.outputs.proceed == 'true'
        working-directory: aur-repo
        run: |
          git config user.name "md-viewer CI"
          git config user.email "ci@noreply.aydiler"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to push to AUR."
            exit 0
          fi
          git commit -m "Update to ${VERSION}"
          # `-u origin HEAD:refs/heads/master` works for both first push
          # (brand-new AUR repo without an upstream) and subsequent pushes.
          git push -u origin HEAD:refs/heads/master

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # Decoupled from publish-snap: the GH release page appears as soon as the
    # build matrix finishes (~12 min sooner). publish-aur-bin already pulls its
    # tarball from download-artifact (not the GH Release URL), so nothing else
    # depends on this ordering.
    needs: [validate, build]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            md-viewer-*.tar.gz
            md-viewer-*.zip
            md-viewer-*.sha256
